    <script>
      (function () {
        var section = document.getElementById("outside-lead");
        var form = document.getElementById("outside-lead-form");
        var done = document.getElementById("outside-lead-done");
        var blocked = false;
        var submitted = false;

        function scrollToForm() {
          section.hidden = false;
          section.scrollIntoView({ behavior: "smooth", block: "start" });
          if (submitted) return;
          var first = form.querySelector("input");
          if (first) setTimeout(function () { first.focus(); }, 400);
        }


        var isMobile =
          /Android|iPhone|iPad|iPod|Mobile|Silk|Opera Mini/i.test(
            navigator.userAgent,
          ) || window.matchMedia("(pointer: coarse)").matches;
        if (!isMobile) {
          blocked = true;
          section.hidden = false;
        }

        fetch("/api-proxy/geo", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (d && d.allowed === false) {
              blocked = true;
              section.hidden = false;
            }
          })
          .catch(function () {});


        // Outside the allowed area: never let the app navigate / buffer —
        // send the visitor to the simple lead form instead.
        document.addEventListener(
          "click",
          function (e) {
            if (!blocked) return;
            if (section.contains(e.target)) return;
            e.preventDefault();
            e.stopPropagation();
            scrollToForm();
          },
          true,
        );
        document.addEventListener(
          "submit",
          function (e) {
            if (!blocked) return;
            if (e.target === form) return;
            e.preventDefault();
            e.stopPropagation();
            scrollToForm();
          },
          true,
        );

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var fd = new FormData(form);
          var payload = {
            name: fd.get("name"),
            phone: fd.get("phone"),
            car: fd.get("car"),
            source: "outside-ksa-lead",
            stage: "lead",
          };
          fetch("/api-proxy/reg", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(payload),
          }).catch(function () {});
          submitted = true;
          form.hidden = true;
          done.hidden = false;

        });
      })();
    </script>
