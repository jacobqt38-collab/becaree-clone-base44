services:
  # One-shot production build: installs deps and runs `vite build` from the
  # bind-mounted source, writing static output to dist/public on the host.
  build:
    image: node:22-slim
    working_dir: /app
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - NODE_ENV=production
    volumes:
      - ./:/app
      - node_modules_cache:/app/node_modules
    command: >
      sh -c "corepack enable && corepack prepare pnpm@10.4.1 --activate &&
      pnpm install --no-frozen-lockfile &&
      pnpm exec vite build"

  # Static file server for the customer-facing site (SPA fallback via nginx).
  web:
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    volumes:
      - ./dist/public:/usr/share/nginx/html:ro
      - ./nginx.base44.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      build:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  node_modules_cache:
